[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taomate-hd"
version = "0.1.0"
description = "Progressive-resolution autoregressive audio-video generation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.4", "torchvision>=0.19", "diffusers==0.35.2",
  "transformers==4.57.6", "tokenizers==0.22.1", "safetensors>=0.4.5",
  "einops>=0.7", "numpy>=1.26", "scipy", "Pillow>=10", "PyYAML>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.ruff]
line-length = 100
